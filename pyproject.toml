[project]
name = "creatorhub-ai"
version = "0.1.0"
description = "AI content partner for creators: MCP server + background trend watcher."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    "anthropic>=1.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
creatorhub = "creatorhub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creatorhub"]

[tool.pytest.ini_options]
pythonpath = ["src"]
